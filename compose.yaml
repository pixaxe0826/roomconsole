services:
  room-hub:
    build: .
    image: room-hub:0.1.6
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8088}:8088"
    environment:
      HUB_DATA_DIR: /app/data
      HUB_PORT: "8088"
      HUB_ADMIN_TOKEN: "${HUB_ADMIN_TOKEN:-}"
      HUB_INGEST_TOKEN: "${HUB_INGEST_TOKEN:-}"
      HUB_SECURE_COOKIE: "${HUB_SECURE_COOKIE:-false}"
    volumes:
      - room-hub-data:/app/data
      - ./widgets:/app/widgets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  room-hub-data:
