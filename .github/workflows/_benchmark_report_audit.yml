name: Temporary benchmark report audit materialization
on:
  push:
    branches: [automation/benchmark-harness-publish-20260922]
    paths: [.github/workflows/_benchmark_report_audit.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize three reviewed source corrections only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          def api(path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/pixaxe0826/roomconsole/' + path,
                  data=None if data is None else json.dumps(data, ensure_ascii=False).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          changes = [
              ('benchmarks/scoring.py', '394dbc09184f2350c0b04b757a984bff95a09f1e', '34846041a359e971968c63fe8ca5c8e1770282d5',
               "    if not eligible: failures.insert(0, 'not_evaluated_llm_or_runtime_unavailable')\n",
               "    if not eligible:\n        # Unavailable inference has no assessable semantic result. Retain observed\n        # safety violations, but never label missing output a wrong capability/slot.\n        failures = ['not_evaluated_llm_or_runtime_unavailable'] + [\n            f for f in failures if f in {'false_execution', 'hallucination_structural'}]\n"),
              ('benchmarks/reports.py', 'd64915a123ecf1f7431a425b17434c2e4d642d06', '7ceb9a2f3de42e50f150cb712f61d51c7044a30b',
               '## 10. 가장 많이 실패한 유형', '## 10. 실패·미평가 유형'),
              ('tests/test_benchmark.py', '56fd0622c070c34401ee1b348913767f589062f6', '136af5aae4109e96eec21cc29756f37df6a85acb',
               "    assert score(suite.cases[55], actual, suite.projection)['task_success'] is None\n",
               "    result_score = score(suite.cases[55], actual, suite.projection)\n    assert result_score['task_success'] is None\n    assert result_score['failures'] == ['not_evaluated_llm_or_runtime_unavailable']\n    assert result_score['capability_ok'] is None and not result_score['slot_matches']\n"),
          ]
          for path, previous, expected, old, new in changes:
              data = base64.b64decode(api('git/blobs/' + previous)['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == previous
              text = data.decode('utf-8')
              assert text.count(old) == 1, 'Unexpected replacement count: ' + path
              text = text.replace(old, new)
              data = text.encode('utf-8')
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
              result = api('git/blobs', {'content': text, 'encoding': 'utf-8'})
              assert result['sha'] == expected
              print(path, expected)
          print('REPORT_AUDIT_BLOBS_VERIFIED=3; no refs or application data changed.')
          PY
