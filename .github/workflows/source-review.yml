name: Source review bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only, never runner/runtime data
        run: |
          mkdir -p artifacts/source-review
          git archive --format=zip --output=artifacts/source-review/source.zip HEAD
          git rev-parse HEAD HEAD^{tree} > artifacts/source-review/identity.txt
          sha256sum artifacts/source-review/source.zip > artifacts/source-review/source.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-review
          path: artifacts/source-review/
          if-no-files-found: error
          retention-days: 7
