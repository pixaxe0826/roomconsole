name: Temporary M3.1 unobserved-policy source correction
on:
  push:
    branches: [automation/m31-source-publish-20260925]
    paths: [.github/workflows/_m31_null_policy_once.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create two hash-verified source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/pixaxe0826/roomconsole/' + path,
                  data=None if data is None else json.dumps(data, ensure_ascii=False).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def read(sha):
              data = base64.b64decode(api('git/blobs/' + sha)['content'])
              assert digest(data) == sha
              return data.decode('utf-8')
          def put(path, text, expected):
              assert digest(text.encode()) == expected, path
              assert api('git/blobs', {'content': text, 'encoding': 'utf-8'})['sha'] == expected
              print(path, expected)
          text = read('72a27b54dc5059ee7506c97bffabd50f67be3168')
          old = "Counter(r['actual'].get('policy') for r in parser_rows)"
          new = "Counter(r['actual'].get('policy') if r['actual'].get('policy') is not None else 'UNOBSERVED' for r in parser_rows)"
          assert text.count(old) == 1
          put('benchmarks/case_diff.py', text.replace(old, new), '76595f47b9c47d93d691766b6639533de2db9a74')
          tests = read('5e3993b24db20061e4158053782265b606684913')
          tests += '''

          def test_parser_policy_summary_handles_unobserved_nlu_policy():
              a = [row('KNOWN'), row('EARLY_BOUNDARY')]
              b = deepcopy(a)
              for value in b:
                  value['actual']['route'] = 'SEMANTIC_PARSER'
              b[1]['actual']['policy'] = None  # NLU boundary has no policy observation.
              _, result = compare(a, b)
              assert result['parser_after']['policy_counts'] == {'EXECUTE': 1, 'UNOBSERVED': 1}
          '''
          put('tests/test_case_diff_m31.py', tests, '900bdea5bac8266292d73747532a54fbc2c776be')
          print('SOURCE_CORRECTIONS_VERIFIED=2; no refs or operational data modified.')
          PY
