name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  HUB_DATA_DIR: artifacts/runtime-data
  # Compatibility suites keep the default profile; Odyssey tests opt in explicitly.
  HUB_AI_PROFILE: legacy
  # Offline regression only. Never inherit or supply paid provider credentials.
  OPENAI_API_KEY: ''
  HUB_OPENAI_API_KEY: ''
  HUB_PERSONAL_AGENT_ENABLED: 'false'
  HUB_OPENAI_ENABLED: 'false'
  HUB_OPENAI_AUDIO_ENABLED: 'false'
  HUB_RUN_LIVE_OPENAI_TESTS: '0'
  HUB_LIVE_OPENAI_BUDGET_USD: ''

jobs:
  backend:
    name: Server / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
            timeout_minutes: 12
          - os: ubuntu-24.04
            python: '3.13'
            timeout_minutes: 12
          - os: ubuntu-24.04
            python: '3.14'
            timeout_minutes: 12
          - os: windows-latest
            python: '3.12'
            timeout_minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Native speech media/certificate test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nginx openssl
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repo.py --json artifacts/test-results/repository.json
      - run: python scripts/check_benchmark_policy.py
      - run: python scripts/check_memo_language.py --json artifacts/test-results/memo-grammar.json
      - name: V35 Git updater shell syntax
        if: runner.os == 'Linux'
        run: bash -n deploy/termux/adopt-git.sh deploy/termux/update-from-git.sh deploy/termux/benchmark.sh deploy/termux/benchmark-data.sh
      - name: Backend tests
        if: runner.os != 'Windows'
        run: python -m pytest -q --junitxml=artifacts/test-results/backend.xml
      # Linux runs the complete behavioral suite, including V35/Termux paths.
      # Windows is a portability smoke job for the supported generic Python server surface.
      - name: Backend tests (Windows portable smoke)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          tests/test_sqlite_runtime_m340.py
          tests/test_remote_speech_m340.py
          tests/test_ai_runtime_m340.py
          tests/test_odyssey_backend.py
          tests/test_odyssey_agent.py
          tests/test_odyssey_ai_runtime.py
          tests/test_backend.py
          tests/test_display_completion.py
          tests/test_all_tasks.py
          tests/test_repo_packaging.py
          tests/test_life.py
          tests/test_life_update.py
          tests/test_widget_protocol.py
          tests/test_llm_widget_bridge.py
          tests/test_routing_confidence.py
          tests/test_remote_update.py
          tests/test_timers.py
          tests/test_timer_instances.py
          tests/test_timer_bridge.py
          tests/test_benchmark.py
          tests/test_benchmark_external.py
          tests/test_benchmark_wrappers.py
          tests/test_benchmark_taxonomy.py
          tests/test_semantic_parser_m3.py
          tests/test_entity_resolver_m3.py
          tests/test_m3_assistant_regression.py
          tests/test_benchmark_m3.py
          tests/test_case_diff_m31.py
          tests/test_semantic_stability_m31.py
          tests/test_semantic_precision_m32.py
          tests/test_interaction_model_m33.py
          tests/test_dialog_state_m33.py
          tests/test_dialog_integrity_m33.py
          tests/test_entity_catalog_m33b.py
          tests/test_memo_grounding_m33b.py
          tests/test_benchmark_catalog_m33b.py
          tests/test_memo_language_m33b1.py
          tests/test_personal_agent.py
          tests/test_agent_adapter_safety.py
          tests/test_agent_budget_safety.py
          tests/test_agent_grounding_safety.py
          tests/test_agent_ingress.py
          tests/test_agent_speech_safety.py
          tests/test_agent_visibility.py
          --timeout=30
          --timeout-method=thread
          --junitxml=artifacts/test-results/backend.xml
      - run: python scripts/live_smoke.py
      - run: python scripts/build_previews.py
      - run: git diff --exit-code -- previews/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: server-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_previews.py
      - run: python scripts/browser_smoke.py
      - run: python scripts/todo_regression.py
      - run: python scripts/all_tasks_regression.py
      - run: python scripts/all_tasks_transport_regression.py
      - run: python scripts/todo_transport_regression.py
      - run: python scripts/preview_regression.py --seconds 65
      - run: python scripts/llm_regression.py
      - run: python scripts/llm_widget_regression.py
      - run: python scripts/llm_widget_live.py
      - run: python scripts/assistant_browser.py
      - run: python scripts/dialog_browser.py
      - run: python scripts/memo_catalog_browser.py
      - run: python scripts/context_browser.py
      - run: python scripts/life_browser.py
      - run: python scripts/fast_reads_browser.py
      - run: python scripts/widget_bridge_browser.py
      - run: python scripts/runtime_browser.py
      - run: python scripts/timers_browser.py
      - name: Speech and agent lifecycle (production JavaScript, mocked transport)
        run: node scripts/agent_speech_transport_regression.js
      - name: Odyssey PC-free routing and diagnostics (mocked transport)
        run: node scripts/odyssey_ui_regression.js
      - name: Speech and agent lifecycle (Chromium, mocked transport)
        run: python scripts/agent_speech_browser.py
      - run: python scripts/benchmark_fast_reads.py --iterations 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chromium-regression
          path: |
            artifacts/test-results/
            artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Container build and health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag room-hub:ci .
      - name: Start without publishing a host port
        run: docker run -d --name room-hub-ci room-hub:ci
      - name: Check non-root process and health
        shell: bash
        run: |
          test "$(docker exec room-hub-ci id -u)" = 10001
          for n in $(seq 1 30); do
            if docker exec room-hub-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Remove temporary container
        if: always()
        run: docker rm -f room-hub-ci || true
