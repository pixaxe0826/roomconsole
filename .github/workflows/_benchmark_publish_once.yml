name: Temporary benchmark blob materialization
on:
  push:
    branches: [automation/benchmark-harness-publish-20260922]
    paths: [.github/workflows/_benchmark_publish_once.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize hash-verified source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import urllib.request

          repo = 'pixaxe0826/roomconsole'
          chunks = [
              'c3355f7146373ae592eb2a17ca7ebd7a0fa2e757',
              '609e523d39c0e08fe313cadce3da7b991cb51395',
              '73bc59fa3a19e2aba7d7bdc4408489a39ea778cf',
              '1ad10c67c38c7b73fac690f1ecbdd17a1981eee3',
              '66d0e35e0de675bc297ace246390253ebff2f3a6',
          ]
          allowed = {
              '.github/workflows/ci.yml', 'README.md',
              'benchmarks/README.md', 'benchmarks/__init__.py',
              'benchmarks/__main__.py', 'benchmarks/dataset.py',
              'benchmarks/reports.py', 'benchmarks/runner.py',
              'benchmarks/runtime.py', 'benchmarks/scoring.py',
              'benchmarks/worker.py',
              'benchmarks/suites/room_hub_v1/README.md',
              'benchmarks/suites/room_hub_v1/SOURCES.md',
              'benchmarks/suites/room_hub_v1/all_250.jsonl',
              'benchmarks/suites/room_hub_v1/fixtures.json',
              'benchmarks/suites/room_hub_v1/manifest.json',
              'benchmarks/suites/room_hub_v1/projection.json',
              'benchmarks/suites/room_hub_v1/provenance.json',
              'benchmarks/suites/room_hub_v1/schema.json',
              'benchmarks/suites/room_hub_v1/unique_tasks_registry_v1.json',
              'deploy/termux/benchmark.sh', 'docs/ASSISTANT_BENCHMARK.md',
              'scripts/repo_policy.py', 'tests/test_benchmark.py',
          }
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  data=data,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'roomconsole-verified-blob-materialization',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          encoded = []
          for sha in chunks:
              blob = api('git/blobs/' + sha)
              content = base64.b64decode(blob['content'])
              digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert digest == sha, 'Transport blob mismatch'
              encoded.append(content.decode('ascii'))
          payload = lzma.decompress(base64.b64decode(''.join(encoded), validate=True))
          assert len(payload) == 464743, 'Unexpected source payload size'
          assert hashlib.sha256(payload).hexdigest() == 'ea3cd3209eb088d187884eb7435768c8277432c8d9cdb69e7d0ad9af1cd1a04c', 'Source payload hash mismatch'
          files = json.loads(payload)
          assert set(files) == allowed, 'Unexpected source path set'
          for path, text in sorted(files.items()):
              assert isinstance(text, str)
              content = text.encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              result = api('git/blobs', {'content': text, 'encoding': 'utf-8'})
              assert result['sha'] == expected, 'Source blob mismatch: ' + path
              print(path, expected, flush=True)
          print('SOURCE_BLOBS_VERIFIED=24')
          print('No refs, pull requests, deployments, or application data were modified by this job.')
          PY
