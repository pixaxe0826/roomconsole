name: 오류 보고
description: 재현 가능한 오류를 보고합니다. 실제 키·연결 링크·개인 데이터는 포함하지 마세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "보안 문제는 공개 이슈 대신 SECURITY.md의 비공개 보고 경로를 먼저 확인하세요."
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: "Room Hub 버전, Windows/Linux/컨테이너, Python, 브라우저·iPadOS"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: "예시 데이터로 재현하는 순서와 기대 동작/실제 동작을 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 정리한 로그·스크린샷
      description: "인증 키, 쿠키, 연결 QR, 실제 일정·위치를 반드시 제거하세요."
  - type: checkboxes
    id: privacy
    attributes:
      label: 제출 전 확인
      options:
        - label: "비밀 키·개인 데이터·실제 음원 파일을 포함하지 않았습니다."
          required: true
