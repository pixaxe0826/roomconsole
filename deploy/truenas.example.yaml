# Example only. Replace POOL and every host path before deployment.
# Requires a TrueNAS release/runtime supporting Docker Compose Custom Apps.
# Host data directory must be writable by UID:GID 10001:10001.
services:
  room-hub:
    build:
      context: /mnt/POOL/apps/room_hub
    image: room-hub:0.1.7
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      HUB_DATA_DIR: /app/data
      HUB_PORT: "8088"
      HUB_SECURE_COOKIE: "false"
      # Initial policy seeds only; existing DB policy is changed by the manager.
      # Supply real keys through private deployment configuration, not this file.
      HUB_PERSONAL_AGENT_ENABLED: "false"
      HUB_OPENAI_ENABLED: "false"
      HUB_OPENAI_AUDIO_ENABLED: "false"
      HUB_OPENAI_ALLOW_SHARED_NOTES: "false"
      OPENAI_API_KEY: ""
      HUB_OPENAI_API_KEY: ""
      HUB_OPENAI_MONTHLY_CAP_USD: "100.00"
      HUB_OPENAI_FAST_MODEL: "gpt-6.1-sol"
      HUB_OPENAI_DEEP_MODEL: "gpt-6.1-sol"
      HUB_OPENAI_REASONING_EFFORT: "high"
      HUB_OPENAI_STT_MODEL: "gpt-4o-mini-transcribe"
    volumes:
      - /mnt/POOL/appdata/room_hub:/app/data
      - /mnt/POOL/apps/room_hub/widgets:/app/widgets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
